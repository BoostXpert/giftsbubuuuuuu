<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Android Version</title>
</head>
<body>

<h2 id="result">Checking...</h2>

<script>
async function getAndroidVersion() {
    // Modern Chrome (User-Agent Client Hints)
    if (navigator.userAgentData &&
        navigator.userAgentData.getHighEntropyValues) {

        try {
            const data = await navigator.userAgentData.getHighEntropyValues([
                "platform",
                "platformVersion",
                "model"
            ]);

            if (data.platform === "Android") {
                return {
                    version: data.platformVersion,
                    model: data.model || "Unknown"
                };
            }
        } catch (e) {
            console.log(e);
        }
    }

    // Fallback to User-Agent
    const match = navigator.userAgent.match(/Android\s([\d.]+)/i);

    return {
        version: match ? match[1] : "Unknown",
        model: "Unknown"
    };
}

(async () => {
    const info = await getAndroidVersion();

    document.getElementById("result").innerHTML = `
        Android Version: ${info.version}<br>
        Model: ${info.model}
    `;

    console.log(info);
})();
</script>

</body>
</html>
