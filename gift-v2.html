<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#180410" />
<title>Happy Anniversary ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   BASE
   ============================================================ */
:root{
  --rose:#ff4d88;
  --gold:#f3d38a;
  --flip: 900ms;
  --ease: cubic-bezier(.45,.05,.25,1);
}
*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  height:100%;
  overflow:hidden;
}
body{
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 18% 0%,  #3a0a22 0%, transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0730 0%, transparent 55%),
    linear-gradient(160deg,#1b0410 0%,#12030b 55%,#1d0518 100%);
  color:#fff;
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}

#bg{ position:fixed; inset:0; z-index:0; display:block; }

.vignette{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 32%, rgba(8,0,4,.62) 100%);
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{
  position:relative; z-index:2;
  height:100%;
  display:flex; flex-direction:column; align-items:center;
  padding: calc(6px + env(safe-area-inset-top)) 14px calc(6px + env(safe-area-inset-bottom));
  gap:2px;
}

.head{ flex:0 0 auto; text-align:center; padding-top:2px; }
.head h1{
  margin:0;
  font-family:'Great Vibes',cursive;
  font-weight:400;
  font-size:clamp(24px,8vw,42px);
  line-height:1.1;
  background:linear-gradient(180deg,#fff 0%,#ffd0e0 42%,#ff5b96 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,70,130,.5));
  animation:titleGlow 4.5s ease-in-out infinite;
}
@keyframes titleGlow{
  0%,100%{ filter:drop-shadow(0 0 12px rgba(255,70,130,.4)); }
  50%    { filter:drop-shadow(0 0 26px rgba(255,70,130,.85)); }
}
.head .sub{
  margin:3px 0 0;
  font-size:clamp(8px,2.4vw,10px);
  letter-spacing:.36em;
  text-indent:.36em;
  text-transform:uppercase;
  color:rgba(255,190,215,.68);
  font-weight:300;
}

/* ============================================================
   STAGE  (book is centred, 2 pages wide)
   ============================================================ */
.stage{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  touch-action:pan-y;
}

/* the book = 2 leaves side by side */
.book{
  --bw: min(44vw, 200px, 30vh);
  width: calc(var(--bw) * 2);
  height: calc(var(--bw) * 1.34);
  position: relative;
  transform-style: preserve-3d;
  perspective: 1600px;
  perspective-origin: 50% 50%;
}

/* soft ground glow */
.book::after{
  content:'';
  position:absolute;
  left:8%; right:8%;
  bottom:-7%;
  height:9%;
  border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(255,60,120,.35), transparent 70%);
  filter:blur(10px);
  z-index:-1;
  pointer-events:none;
}

/* ============================================================
   LEAF  (the physical page)
   ============================================================ */
.leaf{
  position:absolute;
  left:50%;
  top:0;
  width:50%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  transform:rotateY(0deg);
  transition:transform var(--flip) var(--ease);
  will-change:transform;
}
.leaf.flipped{ transform:rotateY(-180deg); }

/* front + back faces */
.face{
  position:absolute; inset:0;
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:3px 14px 14px 3px;
  background:#fff;
  box-shadow:0 10px 24px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.28);
}
.face.back{
  transform:rotateY(180deg);
  border-radius:14px 3px 3px 14px;
}

/* ============================================================
   SPINE SHADOWS  (static darkening near the hinge)
   ============================================================ */
.face::before{
  content:'';
  position:absolute;
  top:0; bottom:0;
  width:24px;
  z-index:100;
  pointer-events:none;
  opacity:.85;
}
.face.front::before{
  left:0;
  background:linear-gradient(to right, rgba(30,0,15,.35), transparent);
}
.face.back::before{
  right:0;
  background:linear-gradient(to left, rgba(30,0,15,.35), transparent);
}

/* ============================================================
   COVER
   ============================================================ */
.cover-front{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  padding:8%;
  background:
    radial-gradient(circle at 28% 16%, rgba(255,160,200,.3), transparent 55%),
    linear-gradient(150deg,#7d1038 0%,#bb155c 45%,#5c0a29 100%);
}
.cover-inner{
  position:relative;
  width:100%; height:100%;
  border:1.5px solid rgba(243,211,138,.5);
  border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4%;
  padding:8%;
  text-align:center;
  overflow:hidden;
  box-shadow:inset 0 0 50px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.06);
}
.cover-inner::after{
  content:'';
  position:absolute; top:-60%; left:-60%;
  width:220%; height:220%;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.18) 50%,transparent 58%);
  animation:coverShine 6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes coverShine{
  0%,55%{ transform:translateX(-65%) rotate(8deg); }
  100%  { transform:translateX(65%) rotate(8deg); }
}
.cover-heart{
  font-size:clamp(22px,7vw,36px);
  color:#ff5f92;
  line-height:1;
  filter:drop-shadow(0 0 16px rgba(255,80,140,.95));
  animation:beat 1.7s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{ transform:scale(1); }
  14%    { transform:scale(1.2); }
  28%    { transform:scale(1); }
  42%    { transform:scale(1.12); }
  56%    { transform:scale(1); }
}
.cover-title{
  font-family:'Great Vibes',cursive;
  font-size:clamp(17px,6.2vw,30px);
  line-height:1.06;
  background:linear-gradient(180deg,#fff7e0,#f3d38a 46%,#c9963f 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
}
.cover-rule{
  width:46%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(243,211,138,.85),transparent);
}
.cover-sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(9px,2.7vw,13px);
  letter-spacing:.08em;
  color:rgba(255,228,238,.88);
}
.cover-tap{
  position:absolute; bottom:6%;
  font-size:clamp(7px,2.1vw,9px);
  letter-spacing:.32em; text-indent:.32em;
  text-transform:uppercase;
  color:rgba(255,220,235,.8);
  animation:tapPulse 2.1s ease-in-out infinite;
}
@keyframes tapPulse{
  0%,100%{ opacity:.35; }
  50%    { opacity:1; }
}

/* ============================================================
   INSIDE COVER (back of cover leaf)
   ============================================================ */
.inside-cover{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:7%;
  padding:14%;
  text-align:center;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,200,222,.55), transparent 65%),
    linear-gradient(160deg,#fff8fb 0%,#ffe8f1 100%);
}
.inside-cover .dedi{
  margin:0;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(11px,3.3vw,16px);
  line-height:1.6;
  color:#a82b58;
}
.inside-cover .dedi-heart{
  font-size:clamp(16px,5vw,26px);
  color:#ff5f92;
  filter:drop-shadow(0 0 12px rgba(255,90,150,.7));
  animation:beat 2.4s ease-in-out infinite;
}

/* ============================================================
   PHOTO PAGE
   ============================================================ */
.page-face{
  background:linear-gradient(160deg,#fffafc 0%,#ffeef5 100%);
}
.page{
  position:relative;
  width:100%; height:100%;
  padding:7% 8% 6.5%;
  display:flex; flex-direction:column;
}
.photo-frame{
  flex:1 1 auto; min-height:0;
  position:relative;
  border-radius:3px;
  overflow:hidden;
  background:#f3e2ea;
  box-shadow:0 3px 14px rgba(140,40,80,.22), 0 0 0 1px rgba(190,120,150,.16);
}
.photo-frame img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  opacity:0;
  transform:scale(1.07);
  transition:opacity .7s ease, transform 1.3s var(--ease);
}
.photo-frame img.loaded{ opacity:1; transform:scale(1); }

.caption{
  flex:0 0 auto;
  padding-top:4.5%;
  text-align:center;
  font-family:'Great Vibes',cursive;
  font-size:clamp(11px,3.6vw,18px);
  line-height:1.2;
  color:#b4305f;
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}
.pagenum{
  position:absolute;
  bottom:2.2%; right:7%;
  font-size:8px;
  letter-spacing:.18em;
  color:rgba(180,48,95,.42);
}

/* ============================================================
   PAPER BACK  (back of the photo pages)
   ============================================================ */
.paper-back{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  background-color:#fff7fb;
  background-image:
    radial-gradient(circle at 50% 42%, rgba(255,196,220,.55), transparent 62%),
    radial-gradient(circle, rgba(255,150,185,.24) 1px, transparent 1.5px);
  background-size:100% 100%, 16px 16px;
  background-repeat:no-repeat, repeat;
}
.paper-back span{
  font-size:clamp(18px,5.5vw,28px);
  color:rgba(255,140,180,.42);
  animation:beat 3s ease-in-out infinite;
}

/* ============================================================
   CLOSING PAGE
   ============================================================ */
.closing-face{
  width:100%; height:100%;
  background:linear-gradient(160deg,#fff6fa 0%,#ffe4ef 55%,#ffd6e6 100%);
}
.closing-page{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:5%;
  padding:12%;
  text-align:center;
}
.closing-heart{
  font-size:clamp(24px,8vw,42px);
  color:#ff4d88;
  filter:drop-shadow(0 0 18px rgba(255,77,136,.7));
  animation:beat 1.9s ease-in-out infinite;
}
.closing-text{
  margin:0;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(12px,3.9vw,18px);
  line-height:1.55;
  color:#a82b58;
}
.closing-sign{
  margin:0;
  font-family:'Great Vibes',cursive;
  font-size:clamp(14px,4.6vw,22px);
  color:#d63c74;
}
.closing-rule{
  width:40%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,60,116,.55),transparent);
}

/* ============================================================
   BACK COVER  (back of the closing leaf)
   ============================================================ */
.back-cover{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,150,200,.22), transparent 60%),
    linear-gradient(150deg,#5c0a29 0%,#7d1038 55%,#3d0619 100%);
}
.back-cover span{
  font-family:'Great Vibes',cursive;
  font-size:clamp(16px,5.2vw,26px);
  color:rgba(243,211,138,.85);
  text-shadow:0 0 18px rgba(255,120,170,.5);
}

/* ============================================================
   CONTROLS
   ============================================================ */
.controls{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  gap:clamp(14px,5vw,26px);
  padding:4px 0 4px;
  min-height:46px;
}
.nav-btn{
  width:42px; height:42px;
  border-radius:50%;
  border:1px solid rgba(255,150,190,.4);
  background:rgba(255,90,145,.12);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#ffd6e6;
  font-size:22px;
  line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .18s ease, background .25s ease, opacity .25s ease, box-shadow .25s ease;
  touch-action:manipulation;
  padding-bottom:3px;
}
.nav-btn:active:not(:disabled){
  transform:scale(.88);
  background:rgba(255,90,145,.3);
}
.nav-btn:disabled{ opacity:.22; cursor:default; box-shadow:none; }
.nav-btn:not(:disabled){ box-shadow:0 0 16px rgba(255,80,140,.3); }

.counter{
  min-width:66px;
  text-align:center;
  font-size:12px;
  letter-spacing:.18em;
  color:rgba(255,190,215,.85);
  font-weight:300;
}
.counter .heart{ color:#ff5f92; }

/* ============================================================
   MUSIC BUTTON
   ============================================================ */
.music-btn{
  position:fixed;
  top:calc(10px + env(safe-area-inset-top));
  right:12px;
  z-index:20;
  width:36px; height:36px;
  border-radius:50%;
  border:1px solid rgba(255,150,190,.35);
  background:rgba(255,90,145,.14);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#ffd6e6;
  font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .2s ease, background .25s ease;
  touch-action:manipulation;
}
.music-btn:active{ transform:scale(.9); }
.music-btn.playing{ background:rgba(255,90,145,.35); animation:beat 1.7s ease-in-out infinite; }
.music-btn.hidden{ display:none; }

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  .cover-inner::after,
  .cover-tap,
  .cover-heart,
  .closing-heart,
  .paper-back span,
  .inside-cover .dedi-heart,
  .music-btn.playing{ animation:none !important; }
  .leaf{ transition-duration:.4s; }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>

<button class="music-btn hidden" id="musicBtn" aria-label="Toggle music">♪</button>
<audio id="bgm" loop preload="none" src="music.mp3"></audio>

<main class="app">

  <header class="head">
    <h1>Happy Anniversary</h1>
    <p class="sub">every page, a memory of us</p>
  </header>

  <div class="stage" id="stage">
    <div class="book" id="book"></div>
  </div>

  <nav class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="counter" id="counter">❤</div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">›</button>
  </nav>

</main>

<script>
(function () {
  'use strict';

  /* ==========================================================
     1. CONFIG
     ========================================================== */
  const PHOTO_COUNT = 5;
  const IMAGE_DIR   = 'image/';
  const EXTENSIONS  = ['jpg', 'jpeg', 'png', 'webp'];
  const FLIP_MS     = 900;                 // must match --flip

  const CAPTIONS = [
    'Where it all began',
    'That smile of yours',
    'Our little adventures',
    'My favourite person',
    'Forever to go'
  ];

  const INSIDE_COVER = 'To my dearest,<br>on our anniversary';
  const CLOSING_TEXT = 'Every page of my life<br>has you written in it.';
  const CLOSING_SIGN = 'Forever yours';

  /* z-index layers ------------------------------------------- */
  const Z_MID_TURN       = 3000;   // leaf while rotating
  const Z_UNFLIPPED_BASE = 1000;   // unflipped leaf i -> 1000 - i
  const Z_FLIPPED_BASE   = 500;    // flipped  leaf i ->  500 + i
  const zUnflipped = i => Z_UNFLIPPED_BASE - i;
  const zFlipped   = i => Z_FLIPPED_BASE   + i;

  /* ==========================================================
     2. PARTICLE BACKGROUND
     ========================================================== */
  const canvas = document.getElementById('bg');
  const ctx    = canvas.getContext('2d');

  const HEART_COLORS = ['#ff5c8a','#ff8fab','#ffb3c6','#ff2d6f','#ffd0dc','#ff7aa8'];
  let W = 0, H = 0, DPR = 1;
  const hearts = [], sparkles = [], bursts = [];

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand  = (a, b) => a + Math.random() * (b - a);

  function heartPath(c, cx, cy, w, h) {
    const x = cx - w / 2, y = cy - h / 2;
    const top = h * 0.3;
    c.beginPath();
    c.moveTo(x + w / 2, y + top);
    c.bezierCurveTo(x + w / 2, y, x, y, x, y + top);
    c.bezierCurveTo(x, y + (h + top) / 2, x + w / 2, y + (h + top) / 2, x + w / 2, y + h);
    c.bezierCurveTo(x + w / 2, y + (h + top) / 2, x + w, y + (h + top) / 2, x + w, y + top);
    c.bezierCurveTo(x + w, y, x + w / 2, y, x + w / 2, y + top);
    c.closePath();
  }

  function sparklePath(c, cx, cy, r) {
    c.beginPath();
    c.moveTo(cx, cy - r);
    c.quadraticCurveTo(cx, cy, cx + r, cy);
    c.quadraticCurveTo(cx, cy, cx, cy + r);
    c.quadraticCurveTo(cx, cy, cx - r, cy);
    c.quadraticCurveTo(cx, cy, cx, cy - r);
    c.closePath();
  }

  function Heart(initial) {
    this.reset(initial);
    if (initial) this.y = rand(0, H);
  }
  Heart.prototype.reset = function (initial) {
    this.x     = rand(-20, W + 20);
    this.y     = initial ? rand(0, H) : rand(-140, -20);
    this.size  = rand(9, 28);
    this.speed = rand(0.25, 0.95);
    this.sway  = rand(0.4, 1.4);
    this.phase = rand(0, Math.PI * 2);
    this.rot   = rand(-0.5, 0.5);
    this.rotV  = rand(-0.012, 0.012);
    this.alpha = rand(0.18, 0.6);
    this.color = HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0];
  };
  Heart.prototype.update = function (dt, t) {
    this.y   += this.speed * dt;
    this.x   += Math.sin(t * 0.0009 * this.sway + this.phase) * 0.55 * dt;
    this.rot += this.rotV * dt;
    if (this.y > H + 80) this.reset(false);
  };
  Heart.prototype.draw = function () {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle   = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    heartPath(ctx, 0, 0, this.size, this.size * 0.92);
    ctx.fill();
    ctx.restore();
  };

  function Sparkle(initial) {
    this.reset(initial);
    if (initial) this.y = rand(0, H);
  }
  Sparkle.prototype.reset = function (initial) {
    this.x   = rand(0, W);
    this.y   = initial ? rand(0, H) : rand(-30, -5);
    this.r   = rand(1.2, 3.4);
    this.vy  = rand(0.15, 0.55);
    this.vx  = rand(-0.18, 0.18);
    this.tw  = rand(0, Math.PI * 2);
    this.twV = rand(0.018, 0.055);
    this.hue = Math.random() < 0.7 ? '255,255,255' : '255,190,225';
  };
  Sparkle.prototype.update = function (dt) {
    this.y  += this.vy * dt;
    this.x  += this.vx * dt;
    this.tw += this.twV * dt;
    if (this.y > H + 30 || this.x < -30 || this.x > W + 30) this.reset(false);
  };
  Sparkle.prototype.draw = function () {
    const a = (Math.sin(this.tw) * 0.5 + 0.5);
    ctx.save();
    ctx.globalAlpha = 0.15 + a * 0.75;
    ctx.fillStyle   = 'rgba(' + this.hue + ',1)';
    ctx.shadowColor = 'rgba(' + this.hue + ',1)';
    ctx.shadowBlur  = 8;
    sparklePath(ctx, this.x, this.y, this.r * (0.6 + a * 0.8));
    ctx.fill();
    ctx.restore();
  };

  function burstAt(x, y, count) {
    for (let i = 0; i < count; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp  = rand(1.4, 5.2);
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 1.6,
        size: rand(6, 20),
        life: 1,
        decay: rand(0.008, 0.02),
        rot: rand(-0.6, 0.6),
        rotV: rand(-0.13, 0.13),
        color: HEART_COLORS[(Math.random() * HEART_COLORS.length) | 0]
      });
    }
  }

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function initParticles() {
    hearts.length = 0;
    sparkles.length = 0;
    const area = W * H;
    const hCount = Math.round(clamp(area / 14000, 18, 46));
    const sCount = Math.round(clamp(area / 8000,  26, 80));
    for (let i = 0; i < hCount; i++) hearts.push(new Heart(true));
    for (let i = 0; i < sCount; i++) sparkles.push(new Sparkle(true));
  }

  let lastT = performance.now();
  function loop(t) {
    const dt = clamp((t - lastT) / 16.667, 0, 3);
    lastT = t;

    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < hearts.length; i++) { hearts[i].update(dt, t); hearts[i].draw(); }
    for (let i = 0; i < sparkles.length; i++) { sparkles[i].update(dt); sparkles[i].draw(); }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.055 * dt;
      p.vx *= 0.99;
      p.rot += p.rotV * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      heartPath(ctx, 0, 0, p.size, p.size * 0.92);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }

  /* ==========================================================
     3. FLIP BOOK
     ========================================================== */
  const bookEl    = document.getElementById('book');
  const stageEl   = document.getElementById('stage');
  const prevBtn   = document.getElementById('prevBtn');
  const nextBtn   = document.getElementById('nextBtn');
  const counterEl = document.getElementById('counter');
  const musicBtn  = document.getElementById('musicBtn');
  const bgm       = document.getElementById('bgm');

  let leaves  = [];
  let current = 0;
  let busy    = false;
  let LAST    = 0;

  /* ---------- placeholder ---------- */
  function placeholder(n) {
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#ffe6f1"/><stop offset="1" stop-color="#ffc3da"/>' +
      '</linearGradient></defs>' +
      '<rect width="300" height="400" fill="url(#g)"/>' +
      '<text x="150" y="200" font-size="68" text-anchor="middle" fill="#ff8fb4">&#10084;</text>' +
      '<text x="150" y="258" font-size="15" text-anchor="middle" fill="#c4557f" ' +
      'font-family="sans-serif">add ' + IMAGE_DIR + n + '.jpg</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ---------- image with extension fallback ---------- */
  function buildPhoto(n) {
    const img = document.createElement('img');
    img.alt = 'Memory ' + n;
    img.decoding = 'async';
    img.dataset.try = '0';

    img.addEventListener('load', function () { img.classList.add('loaded'); });

    function onError() {
      const t = parseInt(img.dataset.try, 10);
      if (t < EXTENSIONS.length - 1) {
        img.dataset.try = String(t + 1);
        img.src = IMAGE_DIR + n + '.' + EXTENSIONS[t + 1];
      } else {
        img.removeEventListener('error', onError);
        img.src = placeholder(n);
        img.classList.add('loaded');
      }
    }
    img.addEventListener('error', onError);
    img.src = IMAGE_DIR + n + '.' + EXTENSIONS[0];
    return img;
  }

  /* ---------- leaf factory ---------- */
  function makeLeaf(frontHTML, backHTML) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.innerHTML =
      '<div class="face front">' + frontHTML + '</div>' +
      '<div class="face back">'  + backHTML  + '</div>';
    return leaf;
  }

  /* ---------- page templates ---------- */
  function coverFrontHTML() {
    return '' +
      '<div class="cover-front">' +
        '<div class="cover-inner">' +
          '<div class="cover-heart">&#10084;</div>' +
          '<div class="cover-title">Happy<br>Anniversary</div>' +
          '<div class="cover-rule"></div>' +
          '<div class="cover-sub">for my dearest love</div>' +
          '<div class="cover-tap">tap to open</div>' +
        '</div>' +
      '</div>';
  }
  function insideCoverHTML() {
    return '' +
      '<div class="inside-cover">' +
        '<div class="dedi-heart">&#10084;</div>' +
        '<p class="dedi">' + INSIDE_COVER + '</p>' +
        '<div class="dedi-heart" style="font-size:13px">&#10084;</div>' +
      '</div>';
  }
  function photoFrontHTML(n) {
    return '' +
      '<div class="page page-face">' +
        '<div class="photo-frame" data-photo="' + n + '"></div>' +
        '<div class="caption">' + (CAPTIONS[n - 1] || '') + '</div>' +
        '<div class="pagenum">' + String(n).padStart(2, '0') + '</div>' +
      '</div>';
  }
  function paperBackHTML() {
    return '<div class="paper-back"><span>&#10084;</span></div>';
  }
  function closingFrontHTML() {
    return '' +
      '<div class="closing-face">' +
        '<div class="closing-page">' +
          '<div class="closing-heart">&#10084;</div>' +
          '<div class="closing-rule"></div>' +
          '<p class="closing-text">' + CLOSING_TEXT + '</p>' +
          '<div class="closing-rule"></div>' +
          '<p class="closing-sign">' + CLOSING_SIGN + '</p>' +
        '</div>' +
      '</div>';
  }
  function backCoverHTML() {
    return '<div class="back-cover"><span>us, always</span></div>';
  }

  /* ---------- build ---------- */
  function buildBook() {
    leaves = [];

    /* 0 — cover */
    leaves.push(makeLeaf(coverFrontHTML(), insideCoverHTML()));

    /* 1..N — photo pages */
    for (let i = 1; i <= PHOTO_COUNT; i++) {
      const leaf = makeLeaf(photoFrontHTML(i), paperBackHTML());
      leaf.querySelector('.photo-frame').appendChild(buildPhoto(i));
      leaves.push(leaf);
    }

    /* last — closing page (back = back cover) */
    leaves.push(makeLeaf(closingFrontHTML(), backCoverHTML()));

    LAST = leaves.length - 1;

    bookEl.innerHTML = '';
    leaves.forEach(function (leaf, i) {
      leaf.style.zIndex = zUnflipped(i);
      bookEl.appendChild(leaf);
    });
  }

  /* ==========================================================
     4. NAVIGATION
     ========================================================== */
  function updateUI() {
    prevBtn.disabled = busy || current === 0;
    nextBtn.disabled = busy || current >= LAST;

    if (current === 0)         counterEl.innerHTML = '<span class="heart">&#10084;</span>';
    else if (current >= LAST)  counterEl.textContent = '\u221E';
    else                       counterEl.textContent = current + ' / ' + PHOTO_COUNT;
  }

  /* forward : flip the top leaf of the right pile  */
  function next() {
    if (busy || current >= LAST) return;
    busy = true;

    const idx  = current;
    const leaf = leaves[idx];
    current++;
    updateUI();

    /* bring to very top, commit, then start the rotation */
    leaf.style.zIndex = Z_MID_TURN;
    void leaf.offsetWidth;

    requestAnimationFrame(function () {
      leaf.classList.add('flipped');
    });

    if (idx === 0) {
      /* cover just opened — celebrate */
      const r = bookEl.getBoundingClientRect();
      burstAt(r.left + r.width * 0.5, r.top + r.height * 0.5, 34);
    }

    finishTurn(leaf, function () {
      leaf.style.zIndex = zFlipped(idx);   // stays visible on the left pile
      busy = false;
      updateUI();
    });
  }

  /* backward : flip the top leaf of the left pile back */
  function prev() {
    if (busy || current <= 0) return;
    busy = true;

    current--;
    const idx  = current;
    const leaf = leaves[idx];
    updateUI();

    /* lift it to the top before rotating back */
    leaf.style.zIndex = Z_MID_TURN;
    void leaf.offsetWidth;

    requestAnimationFrame(function () {
      leaf.classList.remove('flipped');
    });

    finishTurn(leaf, function () {
      leaf.style.zIndex = zUnflipped(idx);
      busy = false;
      updateUI();
    });
  }

  /* wait for the transform transition (with a safety timeout) */
  function finishTurn(leaf, done) {
    let finished = false;

    function run() {
      if (finished) return;
      finished = true;
      leaf.removeEventListener('transitionend', onEnd);
      clearTimeout(timer);
      done();
    }
    function onEnd(e) {
      if (e.target !== leaf) return;
      if (e.propertyName !== 'transform') return;
      run();
    }

    leaf.addEventListener('transitionend', onEnd);
    const timer = setTimeout(run, FLIP_MS + 160);
  }

  /* ---------- input ---------- */
  prevBtn.addEventListener('click', function (e) { e.stopPropagation(); prev(); });
  nextBtn.addEventListener('click', function (e) { e.stopPropagation(); next(); });

  stageEl.addEventListener('click', function () { next(); });

  let tStartX = 0, tStartY = 0, tActive = false;
  stageEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    tStartX = e.touches[0].clientX;
    tStartY = e.touches[0].clientY;
    tActive = true;
  }, { passive: true });

  stageEl.addEventListener('touchend', function (e) {
    if (!tActive) return;
    tActive = false;
    const dx = e.changedTouches[0].clientX - tStartX;
    const dy = e.changedTouches[0].clientY - tStartY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
  });

  /* ==========================================================
     5. OPTIONAL MUSIC
     ========================================================== */
  let musicReady = false;

  (function probeMusic() {
    const test = new Audio();
    test.preload = 'metadata';
    test.addEventListener('loadedmetadata', function () {
      musicReady = true;
      musicBtn.classList.remove('hidden');
    }, { once: true });
    test.addEventListener('error', function () {}, { once: true });
    test.src = 'music.mp3';
  })();

  musicBtn.addEventListener('click', function () {
    if (!musicReady) return;
    if (bgm.paused) {
      bgm.volume = 0;
      bgm.play().then(function () {
        musicBtn.classList.add('playing');
        let v = 0;
        const fade = setInterval(function () {
          v = Math.min(0.65, v + 0.04);
          bgm.volume = v;
          if (v >= 0.65) clearInterval(fade);
        }, 60);
      }).catch(function () {});
    } else {
      bgm.pause();
      musicBtn.classList.remove('playing');
    }
  });

  /* ==========================================================
     6. BOOT
     ========================================================== */
  function boot() {
    resizeCanvas();
    initParticles();
    buildBook();
    current = 0;
    busy = false;
    updateUI();
    requestAnimationFrame(function (t) { lastT = t; loop(t); });
  }

  let resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeCanvas();
      initParticles();
    }, 180);
  });

  window.addEventListener('orientationchange', function () {
    setTimeout(function () { resizeCanvas(); initParticles(); }, 320);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(boot);
  } else {
    window.addEventListener('load', boot);
  }

  /* tiny debug API */
  window.anniversary = { next: next, prev: prev, burst: burstAt };

})();
</script>
</body>
</html>
